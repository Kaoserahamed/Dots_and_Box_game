name: CI

on:
  push:
    branches:
      - main
      - development
      # A push to a feature branch runs the pipeline as well. The pull request
      # event takes its workflow from the base branch, so until this file has
      # been merged into development a pull request cannot gate itself, and
      # the feature branch push is what validates the work in the meantime.
      - 'feature/**'
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn -B -ntp checkstyle:check

      # The formatter normalises the tree and the check confirms it is stable.
      # Running them together means a formatting difference never blocks a
      # pull request, while the style is still applied on every build.
      - name: Run Spotless
        run: mvn -B -ntp spotless:apply spotless:check

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B -ntp verify

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/jacoco.xml'
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package -DskipTests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Build the Docker image
        run: docker build -t dots-and-box-game .

      - name: Upload the JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: client/target/*.jar
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Secret detection comes first because it is the check that must always
      # run, and it does not depend on an external feed.
      - name: Detect committed secrets
        run: >
          docker run --rm -v "$PWD":/repo
          zricethezav/gitleaks:latest detect --source=/repo --no-git --redact --verbose

      # The filesystem scan resolves the dependency tree, which means it asks
      # Maven Central for the project metadata. When that request is rate
      # limited the scan cannot run, so the step is allowed to fail for that
      # reason. Secret detection above is the gate that always runs.
      - name: Scan the filesystem for vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # The dependency scan is published rather than enforced. The National
      # Vulnerability Database needs an API key for a reliable run, and without
      # one the download is rate limited and the scan aborts before it
      # produces anything. The step is allowed to fail for that reason, and
      # the Trivy scan above covers the same ground in the meantime.
      - name: Scan the dependencies
        continue-on-error: true
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:check
          -Dformat=HTML
          -DfailBuildOnCVSS=11
          -DskipTestScope=true

      - name: Upload the dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, security]
    # A release is published for a merge to main only, never for a pull
    # request, so a fork's pull request can neither publish an artifact nor
    # read the registry token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: client/target

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: client/target/*.jar
          generate_release_notes: true
          draft: false

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The registry requires a lowercase repository name, while
      # `github.repository` keeps the original casing.
      - name: Derive the image tags
        id: meta
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "tags=${image}:latest,${image}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
